<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teaching — Secure and Sustainable System Scaling Lab</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container page">
        {{> s4l-header }}
        <!-- <h1>Teaching</h1> -->
        <!-- <p>Courses taught by members of the lab. Each course has its own website with schedule, materials, and announcements.</p> -->

        <section id="courses-ongoing" hidden>
            <h2 class="mt-4">Ongoing Courses</h2>
            <div class="row g-4"></div>
        </section>

        <hr>
        
        <section id="courses-upcoming" hidden>
            <h2 class="mt-4">Upcoming Courses</h2>
            <div class="row g-4"></div>
        </section>

        <hr>
        
        <section id="courses-finished" hidden>
            <h2 class="mt-4">Finished Courses</h2>
            <div class="row g-4"></div>
        </section>

        <!-- Rendered chronologically by start date; the script below moves each
             card into the matching section using data-start/data-end. Without
             JavaScript this list stays visible as a plain chronological list. -->
        <div id="courses-all" class="row g-4 mt-0">
            {{#each courses}}
            <div class="col-12 course-card"{{#if this.start_iso}} data-start="{{ this.start_iso }}"{{/if}}{{#if this.end_iso}} data-end="{{ this.end_iso }}"{{/if}}>
                <div class="h-100">
                    <div class="card-body d-flex flex-column">
                        <h3 class="card-title"><i class="fa fa-{{ this.icon }} fact-icon"></i> {{ this.title }}</h3>
                        <p class="card-subtitle mb-2 text-muted">{{ this.institution }} — {{ this.term }}</p>
                        <p class="card-text">{{ this.description }}</p>
                        <a href="{{ this.link }}" target="_self" class="">Course Website <i class="fa fa-arrow-right"></i></a>
                    </div>
                </div>
            </div>
            {{/each}}
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Segment courses into upcoming / ongoing / finished from their semester
// dates. Test hook: pass ?today=YYYY-MM-DD to view the page as of that date.
document.addEventListener('DOMContentLoaded', function () {
    var override = new URLSearchParams(window.location.search).get('today');
    var today = override ? new Date(override + 'T00:00:00') : new Date();
    if (isNaN(today.getTime())) today = new Date();
    today.setHours(0, 0, 0, 0);

    var source = document.getElementById('courses-all');
    var sections = {
        upcoming: document.querySelector('#courses-upcoming .row'),
        ongoing: document.querySelector('#courses-ongoing .row'),
        finished: document.querySelector('#courses-finished .row'),
    };

    Array.prototype.slice.call(source.querySelectorAll('.course-card')).forEach(function (card) {
        var status = 'ongoing';
        if (card.dataset.start && card.dataset.end) {
            var start = new Date(card.dataset.start + 'T00:00:00');
            var end = new Date(card.dataset.end + 'T00:00:00');
            if (today < start) status = 'upcoming';
            else if (today > end) status = 'finished';
        }
        // Upcoming/ongoing keep chronological order (soonest first); finished
        // courses list most recent first.
        if (status === 'finished') sections.finished.prepend(card);
        else sections[status].appendChild(card);
    });

    Object.keys(sections).forEach(function (key) {
        if (sections[key].children.length > 0) sections[key].parentElement.hidden = false;
    });
    source.hidden = true;
});
</script>
</body>
</html>
