<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teaching — Secure and Sustainable System Scaling Lab</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container page">
        {{> s4l-header }}
        <h1>Teaching</h1>
        <p>Courses taught by members of the lab. Each course has its own website with schedule, materials, and announcements.</p>

        <div class="row g-4 mt-1">
            {{#each courses}}
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title"><i class="fa fa-{{ this.icon }} fact-icon"></i>{{ this.title }}</h5>
                        <h6 class="card-subtitle mb-2 text-muted">{{ this.institution }} — {{ this.term }}</h6>
                        <p class="card-text">{{ this.description }}</p>
                        <a href="{{ this.link }}" target="_self" class="btn btn-outline-dark mt-auto">Course Website <i class="fa fa-arrow-right"></i></a>
                    </div>
                </div>
            </div>
            {{/each}}
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
